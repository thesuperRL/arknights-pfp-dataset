name: Monthly Operator Image Scrape

on:
  schedule:
    # Monthly: 1st of every month at 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Scrape operator images (defaults and skins in one pass)
        run: |
          echo "🚀 Starting operator image scrape (defaults + skins in single pass)..."
          echo "⚠️  Each operator page visited only once for efficiency"
          echo ""
          echo "⭐ Scraping 1-star operators..."
          python scraper.py 1 --skins
          echo ""
          echo "⭐⭐ Scraping 2-star operators..."
          python scraper.py 2 --skins
          echo ""
          echo "⭐⭐⭐ Scraping 3-star operators..."
          python scraper.py 3 --skins
          echo ""
          echo "⭐⭐⭐⭐ Scraping 4-star operators..."
          python scraper.py 4 --skins
          echo ""
          echo "⭐⭐⭐⭐⭐ Scraping 5-star operators..."
          python scraper.py 5 --skins
          echo ""
          echo "⭐⭐⭐⭐⭐⭐ Scraping 6-star operators..."
          python scraper.py 6 --skins
          echo ""
          echo "✅ All rarities scraped (defaults + skins)!"

      - name: Check for changes
        id: verify-changed-files
        run: |
          echo "📊 Checking for new or updated images..."
          echo ""
          git status --short
          echo ""
          
          CHANGED_FILES=$(git status --porcelain default/ all/ 2>/dev/null)
          if [ -n "$CHANGED_FILES" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ Files changed, will commit:"
            echo "$CHANGED_FILES"
            
            NEW_COUNT=$(echo "$CHANGED_FILES" | grep "^??" | wc -l)
            MODIFIED_COUNT=$(echo "$CHANGED_FILES" | grep "^ M" | wc -l)
            echo ""
            echo "📈 New files: $NEW_COUNT"
            echo "📝 Modified files: $MODIFIED_COUNT"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "⏭️  No changes detected - all images are up to date"
          fi

      - name: Commit and push changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          echo "💾 Committing and pushing changes..."
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          echo "📁 Adding image files..."
          git add default/*.png all/*/*.png 2>/dev/null || true
          
          DATE=$(date +'%Y-%m-%d')
          COMMIT_MSG="chore: update operator images from monthly scrape ($DATE) [skip ci]"
          echo "📝 Commit message: $COMMIT_MSG"
          
          git commit -m "$COMMIT_MSG" || exit 0
          
          echo "⬆️  Pushing to remote..."
          git push
          
          echo "✅ Changes successfully pushed!"
